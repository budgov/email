name: Deploy mail Workers
on:
  push:
    branches: [main]
    paths: ['mail-worker/**', 'mail-vue/**']
  workflow_dispatch:
    inputs:
      target:
        description: Production Worker
        type: choice
        required: true
        options: [juuer-mail, budgov-mail]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["juuer-mail","budgov-mail"]') }}
    environment: ${{ matrix.target }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mail-worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Configure existing bindings
        env:
          TARGET: ${{ matrix.target }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          DOMAIN: ${{ vars.DOMAIN }}
          ADMIN: ${{ vars.ADMIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_ID: ${{ vars.D1_DATABASE_ID }}
          DB_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_ID: ${{ vars.KV_NAMESPACE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET_NAME }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ANALYSIS_CACHE: ${{ vars.ANALYSIS_CACHE }}
          EMAIL: ${{ vars.EMAIL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          env = os.environ
          target = env['TARGET']
          db_name, domain = {'juuer-mail': ('juuer-mail', 'juuer.com'), 'budgov-mail': ('email', 'budgov.com')}[target]
          if (env['DB_NAME'], env['CUSTOM_DOMAIN']) != (db_name, 'mail.' + domain):
              raise SystemExit('Environment does not match selected Worker')
          ids = {'juuer-mail': ('324828fb-f707-4089-a3c7-95bf114c2abb', 'ba6738f06072419c99090476fc7a21d7'),
                 'budgov-mail': ('da275f17-bee4-4c99-aaa2-5e82a958cc46', '6b610989930342a585c856e61ad55dc8')}
          if (env['DB_ID'], env['KV_ID']) != ids[target]:
              raise SystemExit('Unexpected storage IDs')
          domains = json.loads(env['DOMAIN'])
          if domain not in domains or not env['ADMIN'] or not env['JWT_SECRET']:
              raise SystemExit('Missing mail configuration')
          cfg = tomllib.loads(pathlib.Path('wrangler-action.toml').read_text())
          cfg.update(name=target, keep_vars=True, routes=[dict(pattern=env['CUSTOM_DOMAIN'], custom_domain=True)],
                     d1_databases=[dict(binding='db', database_name=db_name, database_id=env['DB_ID'])],
                     kv_namespaces=[dict(binding='kv', id=env['KV_ID'])])
          cfg['vars'] = dict(domain=domains, admin=env['ADMIN'], jwt_secret=env['JWT_SECRET'])
          for key in ('AI_MODEL','ANALYSIS_CACHE'):
              if env[key]:
                  cfg['vars'][key.lower()] = env[key]
          if env['R2_BUCKET']:
              cfg['r2_buckets'][0]['bucket_name'] = env['R2_BUCKET']
          else:
              cfg.pop('r2_buckets', None)
          if env['EMAIL'].lower() == 'true':
              cfg['send_email'].append(dict(name='email'))
          pathlib.Path('wrangler-production.json').write_text(json.dumps(cfg))
          PY
      - name: Deploy and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pnpm wrangler deploy -c wrangler-production.json
          sleep 15
          encoded_secret=$(jq -rn --arg secret "$JWT_SECRET" '$secret|@uri')
          echo "::add-mask::$encoded_secret"
          result=$(curl --silent --show-error --fail --max-time 90 "https://$CUSTOM_DOMAIN/api/init/$encoded_secret")
          [[ "$result" == 'success' ]] || { echo 'Application initialization failed'; exit 1; }
          curl -fsS --max-time 20 "https://$CUSTOM_DOMAIN/api/setting/websiteConfig" |
            jq -e '.code == 200 and (.data | type == "object")'
