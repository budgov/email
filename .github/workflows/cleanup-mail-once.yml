name: Clean obsolete mail deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check routes and remove only the accidental cloud-mail Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ops/mail/cleanup_once.py
